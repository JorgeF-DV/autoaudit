name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * *" # 2:00 a. m. en Bogotá
  workflow_dispatch:
    inputs:
      modulos:
        description: "Módulos a mutar (vacío = todos)"
        default: "M1 M3 M5"
        required: false

jobs:
  calidad-y-pruebas:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Estilo y complejidad
        run: ruff check . && ruff format --check .
      - name: Tipos
        run: mypy
      - name: Regla de capas
        run: lint-imports
      - name: Pruebas y cobertura de ramas
        run: coverage run -m pytest && coverage report
      - name: Reporte de pruebas funcionales (caja negra y API)
        if: always()
        run: pytest tests/funcionales --html=reportes/pruebas-funcionales.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-pruebas-funcionales-py${{ matrix.python-version }}
          path: reportes/pruebas-funcionales.html

  # La mutación copia el repositorio y corre la suite por cada mutante: no bloquea los PR.
  mutacion:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Mutación dirigida
        run: python tools/mutantes.py ${{ github.event_name == 'schedule' && 'M1 M3 M5' || inputs.modulos }}
